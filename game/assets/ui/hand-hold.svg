<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="160" height="100">
  <!-- 两只手交握：左侧是小蓝鱼的手（冷调），右侧是大小姐的手（暖调），
       描边沿用整页的墨色 #2f2119。纯线稿，不画渐变，和纸陶木风格一致。 -->
  <g fill="none" stroke="#2f2119" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- 小蓝鱼：手腕 + 四指扣在外侧 -->
    <path d="M8 62 C 26 62, 40 58, 52 52" />
    <path d="M52 52 C 60 47, 70 45, 78 47" />
    <path d="M56 60 C 64 56, 72 55, 80 57" />
    <path d="M60 69 C 68 66, 74 66, 81 68" />
    <!-- 大小姐：手腕 + 拇指压在上方 -->
    <path d="M152 40 C 132 40, 116 44, 104 50" />
    <path d="M104 50 C 96 55, 86 57, 78 55" />
    <path d="M100 42 C 92 38, 84 37, 76 39" />
  </g>
  <!-- 交握处的一点暖色，只一撮，不铺满 -->
  <path d="M70 50 C 76 47, 84 47, 90 50 C 84 53, 76 53, 70 50 Z"
        fill="#d2714a" opacity="0.55" stroke="none"/>
</svg>
